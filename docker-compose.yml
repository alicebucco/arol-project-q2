services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development tool for inspecting the database from a browser. It is not
  # part of the logical architecture (docs/architecture/02-containers.md).
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  # Backend code is expected in ./backend (FastAPI entry point: main:app).
  # See docs/architecture/02-containers.md and 03-components.md.
  backend:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./db:/db:ro
      - ./data:/data:ro
      - model_cache:/models
    environment:
      HF_HOME: /models
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Frontend code is expected in ./frontend (React + TypeScript, Vite).
  # See docs/architecture/02-containers.md.
  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
  model_cache:
