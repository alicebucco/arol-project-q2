services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development tool for inspecting the database from a browser. 
  # It is not part of the logical architecture (docs/architecture/02-containers.md).
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  # Backend code is expected in ./backend (FastAPI entry point: main:app).
  # See docs/architecture/02-containers.md and 03-components.md.
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./db:/db:ro
      - ./data:/data:ro
      - model_cache:/models
    environment:
      HF_HOME: /models
      # The regular HTTP downloader is more reliable than Xet in restricted
      # development networks; the downloaded model is still stored in HF_HOME.
      HF_HUB_DISABLE_XET: "1"
    # The model is downloaded once into model_cache and validated before the
    # API accepts requests. This keeps manual search deterministic at runtime.
    command: sh -c "python scripts/warm_embedding_model.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Local-only evaluation tool. It can write metrics under data/evaluations/;
  # the API service above intentionally keeps the manual directory read-only.
  rag-evaluator:
    profiles: ["tools"]
    build:
      context: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./db:/db:ro
      - ./data:/data
      - model_cache:/models
    environment:
      HF_HOME: /models
      HF_HUB_DISABLE_XET: "1"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  # Frontend code is expected in ./frontend (React + TypeScript, Vite).
  # See docs/architecture/02-containers.md.
  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  db_data:
  model_cache:
