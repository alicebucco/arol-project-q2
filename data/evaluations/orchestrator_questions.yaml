schema_version: 1
dataset:
  name: AROL orchestrator evaluation
  version: "0.1"
  description: >
    Orchestrator evaluation cases based on the entire available synthetic
    dataset. Unless otherwise specified, no time filter is applied. This file
    contains local evaluation data and must not be published.

cases:
  - id: resolved_ticket_alarms_mch0001_001
    category: multi_agent
    description: >
      Identify the MCH-0001 alarms that led to the creation of a ticket that
      was subsequently resolved.
    question: >
      Considering the entire dataset, which alarms recorded for MCH-0001 led
      to the creation of a ticket that was resolved?
    language: en
    context:
      machine_id: MCH-0001
      time_range: all_available_data
    expected:
      intents:
        - alarm_analysis
        - service
      agents:
        - iot
        - service
      clarification_required: false
      access: allowed
      expected_alarm_codes:
        - alarm_code: AL024_FRONT_PANEL_EMERGENCY_PRESSED
          resolved_ticket_count: 1
        - alarm_code: AL031_HEADS_MOTOR_OVERLOAD
          resolved_ticket_count: 1
        - alarm_code: AL083_FALLEN_BOTTLE_ALARM
          resolved_ticket_count: 1
        - alarm_code: AL086_LINE_EMERGENCY_PRESSED
          resolved_ticket_count: 1
      required_conditions:
        - The answer must consider the entire dataset.
        - The answer must consider only alarms belonging to MCH-0001.
        - Every returned alarm must be linked to a ticket whose status is Resolved.
        - The answer must return exactly the four expected alarm codes.
        - The answer must report one resolved ticket for each expected alarm code.
      forbidden_claims:
        - The answer must not include alarms linked only to open or unresolved tickets.
        - The answer must not include data belonging to other machines.
        - The answer must not confuse the number of resolved tickets with the total number of alarm events.

  - id: alarm_occurrence_count_mch0001_001
    category: alarm_analysis
    description: >
      Count the occurrences of a specific alarm code across the entire
      dataset.
    question: >
      Considering the entire dataset, how many times was the
      AL082_MINIMUM_CAPS_LEVEL alarm recorded for MCH-0001?
    language: en
    context:
      machine_id: MCH-0001
      alarm_code: AL082_MINIMUM_CAPS_LEVEL
      time_range: all_available_data
    expected:
      intents:
        - alarm_analysis
      agents:
        - iot
      clarification_required: false
      access: allowed
      expected_facts:
        machine_id: MCH-0001
        alarm_code: AL082_MINIMUM_CAPS_LEVEL
        occurrences: 5
      required_conditions:
        - The answer must consider the entire dataset.
        - The answer must count only events belonging to MCH-0001.
        - The answer must state that AL082_MINIMUM_CAPS_LEVEL was recorded 5 times.
      forbidden_claims:
        - The answer must not count alarms belonging to other machines.
        - The answer must not interpret 5 as the number of tickets.
        - The answer must not add causes or procedures that were not requested.

  - id: undocumented_alarm_guidance_mch0001_001
    category: alarm_guidance
    description: >
      Explain a code that is present in the operational data but is not
      explicitly documented in the manual available for the machine.
    question: >
      Can you explain what the AL083_FALLEN_BOTTLE_ALARM error code means for
      machine MCH-0001?
    language: en
    context:
      machine_id: MCH-0001
      alarm_code: AL083_FALLEN_BOTTLE_ALARM
      time_range: all_available_data
    expected:
      intents:
        - alarm_guidance
      agents:
        - iot
        - manuals
      clarification_required: false
      access: allowed
      expected_facts:
        machine_id: MCH-0001
        alarm_code: AL083_FALLEN_BOTTLE_ALARM
        readable_meaning: Fallen bottle alarm
        exact_manual_documentation_found: false
      required_conditions:
        - The answer must explain that the readable code name refers to a fallen bottle alarm.
        - The answer must clarify that this meaning is inferred from the code name.
        - The answer must state that AL083 was not found explicitly in the available manual.
        - The answer must state that specific causes or procedures cannot be confirmed.
      forbidden_claims:
        - The answer must not claim that AL083 is explicitly documented in the manual.
        - The answer must not invent the cause of the fallen bottle.
        - The answer must not invent checks or recovery procedures.
        - The answer must not present semantically similar passages as confirmed documentation for AL083.
      expected_answer_example: >
        Based on its readable name, AL083_FALLEN_BOTTLE_ALARM indicates an
        alarm related to a fallen bottle. However, I could not find a section
        in the available manual that explicitly documents AL083. I therefore
        cannot confirm specific causes, checks, or recovery procedures.

  - id: maintenance_man_qualities_mch0001_001
    category: manuals
    description: >
      Retrieve the documented qualifications required for a Maintenance Man
      from the manual associated with MCH-0001.
    question: >
      What qualities should a Maintenance Man have?
    language: en
    context:
      machine_id: MCH-0001
      time_range: not_applicable
    expected:
      intents:
        - manuals
      agents:
        - manuals
      clarification_required: false
      access: allowed
      expected_source:
        file: 15610_manual_EN.pdf
        page: 24
      expected_facts:
        - A Maintenance Man must have good technical preparation.
        - A Maintenance Man must have suitable working experience in the relevant field.
        - A Maintenance Man must have specific mechanical and electrical technical knowledge.
        - The required knowledge must be suitable for the operations described in the manual.
      required_conditions:
        - The answer must be based on the manual associated with MCH-0001.
        - The answer must include a citation to page 24 of 15610_manual_EN.pdf.
        - The answer must preserve the meaning of the documented requirements without adding unsupported qualifications.
      forbidden_claims:
        - The answer must not invent certifications, degrees, licences, or training requirements not stated in the source passage.
        - The answer must not use operational, alarm, service, or commercial data.
        - The answer must not cite a different manual as the supporting source.
      reference_passage: >
        The Maintenance Man (mechanical/electrical), besides the above
        characteristics, must also have a good technical preparation and a
        suitable working experience in the relevant field. Further, he must
        have specific and special (mechanical and electrical) technical
        knowledge needed for the operations described in this manual.
      expected_answer_example: >
        According to the machine manual, a Maintenance Man should have good
        technical preparation, suitable experience in the relevant field,
        and the specific mechanical and electrical knowledge required for the
        maintenance operations described in the manual. Source:
        15610_manual_EN.pdf, page 24.

  - id: observed_hours_maintenance_mch0003_001
    category: multi_agent
    description: >
      Compare the productive hours observed for MCH-0003 with the maintenance
      intervals documented in its manual and identify the associated
      activities without claiming access to a lifetime hour counter or a
      complete maintenance history.
    question: >
      Based on the productive hours observed for MCH-0003, which documented
      maintenance thresholds have been reached, and which activities does the
      manual associate with them?
    language: en
    context:
      machine_id: MCH-0003
      time_range: all_available_data
    expected:
      intents:
        - maintenance_due
        - manual_guidance
      agents:
        - iot
        - service
        - manuals
      clarification_required: false
      access: allowed
      expected_source:
        file: 17579_manual_EN.pdf
        page: 97
      expected_facts:
        machine_id: MCH-0003
        observed_productive_hours: 321.53
        periodic_interval_hours: 40
        latest_reached_periodic_interval_hours: 320
        next_documented_threshold_hours: 500
        documented_activities:
          - Check the operation of the safety devices.
          - Check the pneumatic system.
        maintenance_completion_history_available: false
      required_conditions:
        - The answer must describe 321.53 hours as productive hours observed in the available telemetry window.
        - The answer must state that the 40-hour maintenance interval has been reached repeatedly.
        - The answer must identify 320 hours as the latest reached 40-hour interval.
        - The answer must identify 500 hours as the next documented threshold.
        - The answer must mention checking the operation of the safety devices.
        - The answer must mention checking the pneumatic system.
        - The answer must cite page 97 of 17579_manual_EN.pdf for the documented 40-hour activities.
        - The answer must clarify that the available data does not show whether these maintenance activities have already been completed.
      forbidden_claims:
        - The answer must not describe 321.53 hours as the machine's lifetime operating hours.
        - The answer must not claim with certainty that maintenance is overdue.
        - The answer must not claim that the 500-hour threshold has been reached.
        - The answer must not invent additional maintenance activities.
        - The answer must not claim that the maintenance completion history is available.
      expected_answer_example: >
        MCH-0003 has 321.53 observed productive hours in the available
        telemetry window. The manual specifies maintenance checks every 40
        working hours, so the 40-hour interval has been reached repeatedly,
        most recently at 320 hours. The documented activities are checking
        the operation of the safety devices and checking the pneumatic system
        (17579_manual_EN.pdf, page 97). The next documented maintenance
        threshold is 500 hours. However, the available data does not show
        whether the required 40-hour maintenance activities have already been
        completed.

  - id: low_air_pressure_manual_guidance_mch0001_001
    category: multi_agent
    description: >
      Combine the recorded occurrences of AL017_LOW_AIR_PRESSURE for MCH-0001
      with relevant pressure information from its manual, while avoiding an
      unsupported causal link between the alarm and the documented sterile-air
      pressure range.
    question: >
      Considering the entire dataset, how many times was
      AL017_LOW_AIR_PRESSURE recorded for MCH-0001, what pressure requirements
      or checks are documented in its manual, and can the available evidence
      establish why the alarms occurred?
    language: en
    context:
      machine_id: MCH-0001
      alarm_code: AL017_LOW_AIR_PRESSURE
      time_range: all_available_data
    expected:
      intents:
        - alarm_analysis
        - alarm_guidance
        - manual_guidance
      agents:
        - iot
        - iot
        - manuals
      clarification_required: false
      access: allowed
      expected_sources:
        - file: 15610_manual_EN.pdf
          page: 21
          purpose: Documented sterile-air pressure range.
        - file: 15610_manual_EN.pdf
          page: 47
          purpose: Documented pressure check before starting the machine.
      expected_facts:
        machine_id: MCH-0001
        alarm_code: AL017_LOW_AIR_PRESSURE
        occurrences: 4
        sterile_air_minimum_pressure_bar: 5
        sterile_air_maximum_pressure_bar: 8
        startup_check: Check that the working pressure is correct using the pressure gauges.
        pressure_measurements_at_alarm_time_available: false
        exact_alarm_cause_established: false
      required_conditions:
        - The answer must consider the entire dataset and count only events belonging to MCH-0001.
        - The answer must state that AL017_LOW_AIR_PRESSURE was recorded 4 times.
        - The answer must identify 5 to 8 bar as the range documented specifically for sterile air.
        - The answer must cite page 21 of 15610_manual_EN.pdf for the sterile-air pressure range.
        - The answer must state that the manual requires checking the working pressure on the pressure gauges before starting the machine.
        - The answer must cite page 47 of 15610_manual_EN.pdf for the pre-start pressure check.
        - The answer must clarify that no pressure measurements at the times of the alarms are available.
        - The answer must distinguish relevant manual guidance from a confirmed explanation of the alarm events.
      forbidden_claims:
        - The answer must not claim that the pressure was below 5 bar when an alarm occurred.
        - The answer must not claim that AL017 is explicitly tied to the documented sterile-air pressure range.
        - The answer must not describe 5 to 8 bar as a confirmed threshold for triggering AL017.
        - The answer must not claim that the manual establishes the exact cause of the recorded alarms.
        - The answer must not invent pressure readings, faulty components, causes, or recovery procedures.
        - The answer must not use alarm events or manual content belonging to another machine.
      reference_passages:
        - >
          The technical data documents a minimum sterile-air pressure of 5 bar
          and a maximum sterile-air pressure of 8 bar.
        - >
          Before starting the closing machine, check that the working pressure
          is correct; the pressure is indicated on the pressure gauges.
      expected_answer_example: >
        AL017_LOW_AIR_PRESSURE was recorded 4 times for MCH-0001 across the
        entire dataset. The machine manual documents a sterile-air pressure
        range of 5 to 8 bar (15610_manual_EN.pdf, page 21) and instructs the
        operator to check before startup that the working pressure is correct
        using the pressure gauges (15610_manual_EN.pdf, page 47). These are
        relevant checks, but the available data contains no pressure readings
        from the times of the alarms, and the manual evidence does not
        explicitly link AL017 to the sterile-air range. Therefore, the exact
        cause of the recorded alarms cannot be established.

  - id: recurring_cap_alarms_troubleshoot_mch0001_001
    category: diagnostics
    description: >
      Identify the recurring alarm patterns for MCH-0001, retrieve relevant
      guidance about its cap-feeding system from the machine-specific manual,
      and avoid presenting the recurring subsystem or semantically related
      manual passages as a confirmed root cause.
    question: >
      Considering the entire dataset, what recurring problems are visible in
      the alarm history of MCH-0001, which instructions in its manual are
      relevant to the most common affected area, and what can be concluded
      about the root cause?
    language: en
    context:
      machine_id: MCH-0001
      time_range: all_available_data
    expected:
      intents:
        - diagnostic
        - alarm_analysis
        - manual_guidance
      agents:
        - iot
        - manuals
      clarification_required: false
      access: allowed
      expected_sources:
        - file: 15610_manual_EN.pdf
          page: 18
          purpose: Description and operating principles of the Twin Hopper cap-feeding system.
        - file: 15610_manual_EN.pdf
          page: 46
          purpose: Documented operation of the Twin Hopper system when caps are missing or a transfer-disk check error occurs.
      expected_alarm_patterns:
        - alarm_code: AL082_MINIMUM_CAPS_LEVEL
          occurrences: 5
        - alarm_code: AL023_CAPS_CHECK_INTERVENTION
          occurrences: 4
        - alarm_code: AL074_OVERTURNED_CAPS_CHECK
          occurrences: 4
        - alarm_code: AL016_CAPS_CHUTE_FULL
          occurrences: 4
      expected_facts:
        machine_id: MCH-0001
        most_common_affected_area: Cap feeding and cap checking
        confirmed_root_cause_available: false
        relevant_manual_guidance:
          - Keep both cap chutes full.
          - Keep the cap sorter full.
          - Give operating priority to the primary cap chute.
          - If caps are missing from the chute or the first transfer-disk release check reports an error, the system uses the secondary cap chute.
          - If the problem is in the cap chute or on the transfer disk, production may continue temporarily with the secondary chute while the bottle flow is stopped to restore the priority chute.
      required_conditions:
        - The answer must consider the entire available alarm dataset for MCH-0001.
        - The answer must identify AL082_MINIMUM_CAPS_LEVEL as the most frequent alarm with 5 occurrences.
        - The answer must report 4 occurrences each for AL023_CAPS_CHECK_INTERVENTION, AL074_OVERTURNED_CAPS_CHECK, and AL016_CAPS_CHUTE_FULL.
        - The answer must identify cap feeding and cap checking as the area shared by the most frequent recurring conditions.
        - The answer must cite pages 18 and 46 of 15610_manual_EN.pdf for the relevant Twin Hopper guidance.
        - The answer must distinguish observed alarm patterns from the manual's general operating guidance.
        - The answer must state that the available evidence does not establish a confirmed root cause.
      forbidden_claims:
        - The answer must not claim that any of the expected alarm codes is explicitly documented on pages 18 or 46.
        - The answer must not claim that a lack of caps is the confirmed root cause of all the recurring alarms.
        - The answer must not claim that the primary cap chute, secondary cap chute, cap sorter, photocell, or transfer disk is known to be faulty.
        - The answer must not present a semantically related manual passage as an exact alarm-code procedure.
        - The answer must not invent inspections, adjustments, replaced components, or completed repairs.
        - The answer must not include alarms or manual content belonging to another machine.
      reference_passages:
        - >
          The Twin Hopper feeding system uses two independent cap chutes. For
          correct operation, both cap chutes and the cap sorter should be kept
          full, with operating priority given to the primary chute.
        - >
          If caps are missing from the cap chute or the first transfer-disk
          release check reports an error, cap release is performed through the
          secondary chute. If the error is in the chute or on the transfer
          disk, production can continue with the secondary chute while bottle
          flow is stopped to restore the priority chute.
      expected_answer_example: >
        Across the entire dataset, the most frequent recurring alarm for
        MCH-0001 is AL082_MINIMUM_CAPS_LEVEL with 5 occurrences.
        AL023_CAPS_CHECK_INTERVENTION, AL074_OVERTURNED_CAPS_CHECK, and
        AL016_CAPS_CHUTE_FULL each occurred 4 times. Together, these patterns
        indicate that cap feeding and cap checking are the most commonly
        affected area. The manual describes the Twin Hopper system and states
        that both cap chutes and the cap sorter should be kept full, with
        priority given to the primary chute (15610_manual_EN.pdf, page 18). It
        also explains how the secondary chute is used when caps are missing or
        a transfer-disk release check reports an error, and how the priority
        chute can be restored (page 46). These instructions identify relevant
        areas to inspect, but they do not explicitly document the listed alarm
        codes or establish the root cause of the recorded events.

  - id: recurring_bottle_handling_troubleshoot_mch0006_001
    category: diagnostics
    description: >
      Identify recurring bottle-handling alarm patterns for MCH-0006, retrieve
      relevant checks and adjustments from its machine-specific manual, and
      avoid treating related troubleshooting passages as confirmed causes of
      the recorded alarms.
    question: >
      Considering the entire dataset, what recurring bottle-handling problems
      are visible for MCH-0006, which checks or adjustments documented in its
      manual are relevant, and what can be concluded about the root cause?
    language: en
    context:
      machine_id: MCH-0006
      time_range: all_available_data
    expected:
      intents:
        - diagnostic
        - alarm_analysis
        - manual_guidance
      agents:
        - iot
        - manuals
      clarification_required: false
      access: allowed
      expected_sources:
        - file: A2064_manual_EN.pdf
          page: 39
          purpose: Preliminary checks for container format, closure-unit height, and equipment alignment.
        - file: A2064_manual_EN.pdf
          page: 111
          purpose: Troubleshooting guidance concerning starwheel timing, transfer equipment, and head height.
      expected_alarm_patterns:
        - alarm_code: AL057_BOTTLE_TOO_HIGH
          occurrences: 7
        - alarm_code: AL051_ENTRANCE_FEED_SCREW_SENSOR
          occurrences: 3
        - alarm_code: AL052_INFEED_STARWHEEL_SENSOR
          occurrences: 2
        - alarm_code: AL053_OUTFEED_STARWHEEL_SENSOR
          occurrences: 1
        - alarm_code: AL054_TRANSFER_STARWHEEL_SENSOR
          occurrences: 1
      expected_facts:
        machine_id: MCH-0006
        most_common_alarm_code: AL057_BOTTLE_TOO_HIGH
        most_common_affected_area: Bottle handling, transfer, and height
        confirmed_root_cause_available: false
        relevant_manual_guidance:
          - Verify that the installed equipment is suitable for the container size being processed.
          - Verify the correspondence between the container and cap.
          - Check the height of the closure unit according to the container height.
          - Check equipment alignment with a complete slow-speed cycle in jog mode after feeding a few containers.
          - Check starwheel timing, suitable transfer equipment, and correct head height when investigating the related documented container-handling faults.
      required_conditions:
        - The answer must consider the entire available alarm dataset for MCH-0006.
        - The answer must identify AL057_BOTTLE_TOO_HIGH as the most frequent alarm with 7 occurrences.
        - The answer must report 3 occurrences of AL051_ENTRANCE_FEED_SCREW_SENSOR and 2 occurrences of AL052_INFEED_STARWHEEL_SENSOR.
        - The answer must report 1 occurrence each of AL053_OUTFEED_STARWHEEL_SENSOR and AL054_TRANSFER_STARWHEEL_SENSOR.
        - The answer must identify bottle handling, transfer, and height as the area shared by the selected alarm patterns.
        - The answer must cite pages 39 and 111 of A2064_manual_EN.pdf for the relevant checks and troubleshooting guidance.
        - The answer must distinguish observed alarm patterns from the manual's general and symptom-based guidance.
        - The answer must state that the available evidence does not establish a confirmed root cause.
      forbidden_claims:
        - The answer must not claim that any expected alarm code is explicitly documented on pages 39 or 111.
        - The answer must not claim that the closure head is known to be incorrectly adjusted.
        - The answer must not claim that a starwheel is known to be incorrectly timed.
        - The answer must not claim that the installed transfer equipment is known to be unsuitable.
        - The answer must not present a semantically related manual passage as an exact alarm-code procedure.
        - The answer must not invent inspections, adjustments, replaced components, or completed repairs.
        - The answer must not include alarms or manual content belonging to another machine.
      reference_passages:
        - >
          Before startup, verify that the installed equipment is suitable for
          the size being processed, check the correspondence between container
          and cap, check the closure-unit height according to the container
          height, and verify alignment with a slow cycle in jog mode.
        - >
          For the documented symptoms involving damaged or badly guided
          containers, the troubleshooting table identifies starwheel timing,
          suitable transfer equipment, and correct head height as relevant
          checks and adjustments.
      expected_answer_example: >
        MCH-0006 recorded 7 occurrences of AL057_BOTTLE_TOO_HIGH. Other
        bottle-handling conditions include AL051_ENTRANCE_FEED_SCREW_SENSOR
        with 3 occurrences, AL052_INFEED_STARWHEEL_SENSOR with 2, and
        AL053_OUTFEED_STARWHEEL_SENSOR and AL054_TRANSFER_STARWHEEL_SENSOR with
        1 each. These patterns make bottle handling, transfer, and height
        relevant areas to inspect. The manual instructs operators to verify
        that the installed equipment is suitable for the container format,
        check the closure-unit height, and confirm equipment alignment with a
        slow test cycle (A2064_manual_EN.pdf, page 39). Its troubleshooting
        table also discusses starwheel timing, suitable transfer equipment,
        and correct head height for related container-handling symptoms (page
        111). However, these passages do not explicitly document the recorded
        alarm codes, so the available evidence does not establish which
        component or adjustment caused the alarms.

  - id: recurring_motor_overloads_troubleshoot_mch0007_001
    category: diagnostics
    description: >
      Identify the recurring motor-overload conditions for MCH-0007, keep the
      head motor and cap-sorter motor distinct, retrieve relevant manual
      inspection guidance, and avoid asserting an unsupported common cause.
    question: >
      Considering the entire dataset, which recurring motor-overload
      conditions are visible for MCH-0007, which checks documented in its
      manual are relevant to the affected components, and can the underlying
      cause be identified?
    language: en
    context:
      machine_id: MCH-0007
      time_range: all_available_data
    expected:
      intents:
        - diagnostic
        - alarm_analysis
        - manual_guidance
      agents:
        - iot
        - manuals
      clarification_required: false
      access: allowed
      expected_sources:
        - file: A2055_manual_EN.pdf
          page: 38
          purpose: Startup checks for motor absorption and rotation direction.
        - file: A2055_manual_EN.pdf
          page: 44
          purpose: Maintenance checks for closure heads and freely rotating rollers.
        - file: A2055_manual_EN.pdf
          page: 46
          purpose: Checks for abnormal noise or vibration in motorization components.
        - file: A2055_manual_EN.pdf
          page: 88
          purpose: Check of the cap orientator internal-disc rotation direction.
      expected_alarm_patterns:
        - alarm_code: AL031_HEADS_MOTOR_OVERLOAD
          occurrences: 6
        - alarm_code: AL032_CAPS_SORTER_MOTOR_OVERLOAD
          occurrences: 6
      expected_facts:
        machine_id: MCH-0007
        affected_components:
          - Head motor
          - Cap-sorter motor
        confirmed_root_cause_available: false
        relevant_manual_guidance:
          - Check the motor absorption and rotation direction before startup.
          - Clean the closure heads and verify that the threading and seaming rollers rotate freely.
          - Check for abnormal noise or vibration in motors, reducers, gears, and bearings.
          - Check that the cap orientator internal disc rotates in the correct direction.
      required_conditions:
        - The answer must consider the entire available alarm dataset for MCH-0007.
        - The answer must report 6 occurrences of AL031_HEADS_MOTOR_OVERLOAD.
        - The answer must report 6 occurrences of AL032_CAPS_SORTER_MOTOR_OVERLOAD.
        - The answer must keep the head-motor overload and cap-sorter-motor overload as distinct recorded conditions.
        - The answer must cite pages 38, 44, 46, and 88 of A2055_manual_EN.pdf for the relevant checks.
        - The answer must distinguish documented inspection areas from confirmed causes of the alarms.
        - The answer must state that the available evidence does not identify the underlying cause of either overload condition.
      forbidden_claims:
        - The answer must not claim that AL031 or AL032 is explicitly documented on the cited manual pages.
        - The answer must not claim that both overload conditions have the same cause.
        - The answer must not claim that the motor rotation direction is known to be incorrect.
        - The answer must not claim that the closure-head rollers are known to be blocked.
        - The answer must not claim that abnormal noise, vibration, friction, wear, or an electrical fault was observed.
        - The answer must not present a semantically related manual passage as an exact alarm-code procedure.
        - The answer must not invent inspections, adjustments, replaced components, or completed repairs.
        - The answer must not include alarms or manual content belonging to another machine.
      reference_passages:
        - >
          Before startup, check the correct motor absorption and rotation
          direction.
        - >
          Planned maintenance includes cleaning the closure heads and checking
          that the threading and seaming rollers rotate freely.
        - >
          Check for abnormal noise or vibration in motorization components,
          including motors, reducers, gears, and bearings.
        - >
          During cap-orientator installation, check that the internal disc
          rotates in the correct direction.
      expected_answer_example: >
        MCH-0007 recorded 6 occurrences of AL031_HEADS_MOTOR_OVERLOAD and 6
        occurrences of AL032_CAPS_SORTER_MOTOR_OVERLOAD. These are two distinct
        recurring conditions involving the head motor and the cap-sorter
        motor. The manual recommends checking motor absorption and rotation
        direction (A2055_manual_EN.pdf, page 38), cleaning the closure heads
        and verifying that their rollers rotate freely (page 44), and checking
        for abnormal noise or vibration in motors, reducers, gears, and
        bearings (page 46). It also describes checking the rotation direction
        of the cap orientator's internal disc (page 88). These are relevant
        inspection areas, but the cited passages do not explicitly document
        AL031 or AL032, and the available data does not identify the underlying
        cause of either overload condition.

  - id: active_maintenance_tickets_mch0003_001
    category: service
    description: >
      Identify the maintenance tickets for MCH-0003 that still have a
      non-final status and report their service details and related alarm
      without including completed tickets or data from another machine.
    question: >
      Considering the entire dataset, which maintenance tickets for MCH-0003
      are still active, and what are their type, priority, owner role, and
      related alarm?
    language: en
    context:
      machine_id: MCH-0003
      time_range: all_available_data
    expected:
      intents:
        - service
        - alarm_analysis
      agents:
